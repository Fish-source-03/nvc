# ============================================================
# P3 阶段配置：CQRS 读写分离 + Embedding 语义路由 + Provider 切换
# 激活方式：spring.profiles.active=p3 或 spring.profiles.active=p1,p2,p3
# ============================================================

spring:
  datasource:
    # 写库（主库）— 与 P1/P2 配置一致
    # 地址可由环境变量 SPRING_DATASOURCE_WRITE_URL 覆盖（容器部署时指向 mysql:3306）；
    # 未设置时保留原 localhost 默认值，不改变本地开发行为。
    write:
      jdbc-url: "${SPRING_DATASOURCE_WRITE_URL:jdbc:mysql://localhost:3308/agent_qr?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}"
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    # 读库（从库）— 初期可与主库同实例
    # 地址可由环境变量 SPRING_DATASOURCE_READ_URL 覆盖（容器部署时指向 mysql:3306）；
    # 未设置时保留原 localhost 默认值，不改变本地开发行为。
    read:
      jdbc-url: "${SPRING_DATASOURCE_READ_URL:jdbc:mysql://localhost:3309/agent_qr?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}"
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

# ============================================================
# P3 专属配置
# ============================================================
agent-qr:
  cqrs:
    enabled: true                          # 启用 CQRS 读写分离
    read-replica-fallback-to-primary: true # 初期从库不存在时回退到主库

  routing:
    # 域路由模式（批次 07 · 任务 7.5 接通；批次 10 · 任务 10.5.6 / R27 明确可达性）：
    #   keyword  = 仅 V1 关键词路由
    #   semantic = 仅 V2 语义路由（未匹配/不可用时回退全局检索）
    #   auto     = V2 语义优先 → V1 关键词降级 → 全局检索
    # 读取点：ChatQueryService.@Value("${agent-qr.routing.mode}")，启动日志会输出生效值。
    #
    # ⚠️ 可达性说明（R27，批次 07 独立验证实测确认；批次 10 按"保留接线 + 明确标注"处置）：
    #   HTTP 入口 ChatController.requireDomain() 强制 domain 非空（批次 03 越权防护决策），
    #   而 ChatQueryService.resolveRouting() 在 domain 非空时【直接锁定该域并返回】，
    #   于是下面的模式 switch 在 /api/chat/** 这条 HTTP 路径上【永不执行】——
    #   即"改了有日志、有单测，但对用户可见行为仍是死的"。
    #   本开关真实面向的是：① 内部调用（domain 传 null 的场景，当前仓库内无 HTTP 调用方）；
    #   ② 预留能力（将来若开放"自动路由"入口，切模式无需改代码）。
    #   ❌ 不得为了让它生效而放宽 domain 强制 —— 会重开"不传域即全局检索"的越权绕过路径。
    mode: semantic
    # 以下两个键确有读取点（DomainRouterV2，semantic/auto 模式的路由打分参数），非死配置：
    similarity-threshold: 0.3              # Embedding 余弦相似度阈值（DomainRouterV2 读取）
    top-k: 2                               # 返回 Top K 个匹配域（DomainRouterV2 读取）

  provider:
    auto-failover: true                    # 熔断时自动切换备用 Provider
    preferred-llm: deepseek                # 首选 LLM Provider
    # 注：preferred-embedding 已于批次 07 · 任务 7.2.8 删除——它不参与 decideEmbeddingProvider()
    #（恒返回 ollama），属"改了没反应"的误导键。Embedding Provider 的生效开关是
    # application-p1.yml 的 embedding.provider。

  embedding:
    # 批次 07 · 任务 7.1 已接通：隔离命名 = {prefix}_{provider}_{model}，如 kb_ollama_qwen3-embedding-4b。
    # 注意：若既有 Collection（langchain4j.chroma.collection-name）已有数据而隔离命名尚未建立，
    # 仍继续使用既有 Collection（保护历史向量可检索），日志会给出启用隔离所需的迁移提示。
    collection-prefix: kb
    # 启动时自动检测向量维度一致性；false 则跳过检测并固定使用既有 Collection（隔离关闭）。
    auto-dimension-check: true
