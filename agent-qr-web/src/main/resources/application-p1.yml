jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000  # 24 hours

llm:
  provider: deepseek
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    temperature: 0.7
    max-tokens: 2048

embedding:
  provider: ollama                    # ★ 使用本地 Ollama qwen3-embedding:4b（P2 配置: ollama.embedding.*）

langchain4j:
  chroma:
    base-url: http://localhost:8000
    collection-name: enterprise_knowledge

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

rag:
  chunk-size: 500
  chunk-overlap: 50
  embedding:
    # 是否执行向量化（批次 10 · 任务 10.5.3 接通，问题 38；读取点 ChunkEmbeddingBatchListener）。
    # true  = 正常向量化：切片 INDEXED → EMBEDDING → READY（写入 ChromaDB）
    # false = 跳过向量化：切片只到 INDEXED（已入库，BM25 关键词可搜；语义检索暂不可用，不写 ChromaDB）
    # 用途：Ollama/ChromaDB 故障或想省算力时的运维应急开关。关闭期间的数据不会自动补做向量化，
    #       重新打开后需走既有 DLQ 重放路径补做（详见 ChunkEmbeddingBatchListener 的字段注释）。
    # 注：修复前的注释误写为"P1: 关闭 ChromaDB 写入"而取值是 true，属注释与取值矛盾，已修正。
    write-to-chromadb: true
