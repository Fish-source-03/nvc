# ============================================================
# P2 阶段配置文件 — 汇聚所有 P2 新增配置项
# ============================================================

# ── JWT 双 Token ──
jwt:
  access-expiration: 1800       # Access Token 30分钟
  refresh-expiration: 604800    # Refresh Token 7天

# ── Ollama 本地 LLM Provider ──
ollama:
  llm:
    base-url: http://localhost:11434
    model: qwen2.5:4b
  embedding:
    base-url: http://localhost:11434
    model: qwen3-embedding:4b
    max-response-bytes: 16777216   # 批量 /api/embed 响应缓冲上限（批次 05 · 任务 5.2.5）。
                                   # WebClient 默认仅 256KB，而 32 条 × 2560 维 ≈ 1.1MB，
                                   # 不放大会抛 DataBufferLimitException 并退化为逐条重试

# ── Agent-QR P2 增强配置 ──
agent-qr:
  # 混合检索
  retrieval:
    semantic-weight: 0.55       # 语义检索权重（从 0.6 下调，提升 BM25 关键词匹配地位）
    keyword-weight: 0.45        # 关键词检索权重（从 0.4 上调）
    wide-top-k: 30              # 宽召回 TopK（每次从 ChromaDB/BM25 各拉取 30 条候选）
    final-top-k: 30             # Reranker 精排后的候选数（15→30，问题 13；与 HybridRetriever 代码默认值保持一致）
    rrf-k: 15                   # RRF 融合常数 k（越小排名区分度越大，原值 60）
    max-context-tokens: 8000    # 文档上下文 token 预算上限（含 LLM 回复预留 2048）

  # 结构化字段过滤 — LLM 自动提取（批次 04 · 任务 4.3，问题 12）
  filter:
    llm-extract:
      enabled: false            # ★ 灰度开关：默认关闭（未开启时检索行为与修复前完全一致）
      timeout-seconds: 5        # LLM 提取调用超时（秒），超时即降级为「无过滤条件」

  # 聚合查询路径（批次 04 · 任务 4.4，问题 13）
  aggregation:
    max-chunk-ids: 2000         # 无界结构化查询安全上限（防止极端条件组合导致全表扫描）
    llm-classify:
      enabled: false            # 意图分类 LLM 兜底：默认关闭（规则匹配优先，零额外延迟）
      timeout-seconds: 5        # LLM 分类调用超时（秒），超时即回落为 SEMANTIC

  # Reranker
  reranker:
    model: bge-reranker-v2-m3   # 精排模型（P3 升级为 API 调用）

  # LLM 熔断器
  circuit-breaker:
    failure-threshold: 3        # 连续失败次数阈值
    open-duration-ms: 30000     # 熔断打开持续时间（毫秒）

  # 批量向量化攒批
  embedding:
    batch-size: 32              # 攒批大小
    batch-timeout-ms: 100       # 批超时（毫秒）
    queue-capacity: 10000       # 攒批队列容量（批次 05 · 任务 5.2.3，原为硬编码 2000）

  # DLQ 死信队列
  dlq:
    max-retries: 4              # 最大重试次数（3s→9s→27s→81s）
    backoff-base: 3             # 退避基数（秒）

  # 数据源定时同步（批次 05 · 任务 5.3，问题 22）
  datasource:
    sync:
      max-consecutive-failures: 5   # 连续失败达该次数即熔断暂停定时任务，防止失败重试风暴

  # 数据质量检查
  data-quality:
    block-threshold: 0.5        # 阻断阈值（通过率低于此值阻断）
    content-fields: content,text,_content  # 完整性检查的字段名（逗号分隔）

  # PDF 解析
  pdf:
    max-memory-mb: 256          # 内存模式最大文件大小（MB）
    ocr:
      enabled: false            # OCR 开关（P3 集成 Tesseract）

  # Caffeine 缓存
  cache:
    max-size: 10000             # 最大缓存条数
    ttl-hours: 1                # 缓存过期时间（小时）
