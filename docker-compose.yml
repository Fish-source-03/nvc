# ============================================
# Agent-QR Docker Compose 编排文件
# P1 阶段组件:
#   - MySQL 8.0        (数据库)
#   - ChromaDB         (向量数据库)
#   - agent-qr-backend (Spring Boot 后端)
# ============================================

services:
  # ==========================================
  # MySQL 8.0 - 关系型数据库
  # ==========================================
  mysql:
    image: mysql
    container_name: agent-qr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_qr}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      # 数据持久化
      - mysql-data:/var/lib/mysql
      # 初始化 SQL 脚本 (首次启动自动执行)
      - ./agent-qr-web/src/main/resources/db/p1-schema.sql:/docker-entrypoint-initdb.d/01-p1-schema.sql
      - ./agent-qr-web/src/main/resources/db/p2-schema.sql:/docker-entrypoint-initdb.d/02-p2-schema.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - agent-qr-network

  # ==========================================
  # ChromaDB - 向量数据库
  # 注意: chromadb/chroma:latest 是 Rust distroless 镜像，
  # 内部没有 shell/curl/python，无法执行常规健康检查命令。
  # 启动即代表服务可用。
  #
  # 持久化路径（ChromaDB 1.0.0 实测）：
  #   实际写入目录由镜像内 /config.yaml 的 persist_path 决定，为 /data
  #   （启动日志 "Saving data to: /data"），卷必须挂到 /data，
  #   挂到 /chroma/chroma 会使数据只存在于容器可写层，容器重建即丢失。
  # ==========================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: agent-qr-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      # ⚠️ 该变量自 ChromaDB 1.0.0 起不再生效（持久化路径改由镜像内 /config.yaml 决定）。
      # 保留仅为兼容旧版本镜像，请勿据此判断挂载点。
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      # 与 1.0.0 的实际数据目录 /data 对齐（原为 /chroma/chroma，导致数据未持久化）
      - chroma-data:/data
    networks:
      - agent-qr-network

  # ==========================================
  # Reranker 推理服务（TEI + bge-reranker-v2-m3，CPU 版）
  # 用途：RAG 精排（cross-encoder），由 agent-qr.reranker.* 配置调用
  #
  # 重要事实（首次部署实测，详见 doc/修复-tasks/progress.md 4.8）：
  #   - 模型已预置于卷内（ModelScope 下载），运行时无网络依赖
  #   - CPU fp32 推理内存约 3.2GB；max-batch-tokens 必须降至 2048
  #     （默认 16384 会导致容器 OOM，实测 OOMKilled）
  #   - 端点：POST http://localhost:8080/rerank  {"query":"...","texts":["..."]}
  #     响应按 score 降序；top_n 参数被忽略（Java 侧自行截断）；单请求最多 32 条
  # ==========================================
  reranker:
    image: ghcr.nju.edu.cn/huggingface/text-embeddings-inference:cpu-latest
    container_name: agent-qr-reranker
    restart: unless-stopped
    command:
      - "--model-id"
      - "/data/bge-reranker-v2-m3"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "32"
      - "--tokenization-workers"
      - "4"
    environment:
      HF_ENDPOINT: https://hf-mirror.com
    ports:
      - "${RERANKER_PORT:-8080}:80"
    volumes:
      - reranker-data:/data
    networks:
      - agent-qr-network

  # ==========================================
  # Spring Boot 后端
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-qr-backend
    restart: unless-stopped
    environment:
      # Spring 配置
      SPRING_PROFILES_ACTIVE: p1, p2, p3
      # CQRS 读写库地址（对应 application-p3.yml 的 spring.datasource.write/read.jdbc-url）。
      # 注意：CQRS 常开时 spring.datasource.url 不再被绑定，改 SPRING_DATASOURCE_URL 无任何效果。
      # 读库初期与主库同实例，如需真实从库请改 READ_URL 的 host/port。
      SPRING_DATASOURCE_WRITE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-agent_qr}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_READ_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-agent_qr}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # DeepSeek API
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # ChromaDB
      LANGCHAIN4J_CHROMA_BASE_URL: http://chromadb:8000
      # 文件上传
      FILE_UPLOAD_DIR: /app/uploads
      # Java 内存配置
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${BACKEND_PORT:-9090}:9090"
    volumes:
      - ${UPLOAD_DIR:-./uploads}:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://localhost:9090/api/auth/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - agent-qr-network

# ==========================================
# 数据卷 (持久化存储)
# ==========================================
volumes:
  mysql-data:
    name: agent-qr-mysql-data
  chroma-data:
    name: agent-qr-chroma-data
  # ⚠️ external：该卷已由首次部署创建（含 2.29GB 预置模型），必须声明 external；
  #    否则 compose 会新建一个空卷，导致容器找不到模型而启动失败。
  reranker-data:
    name: agent-qr-reranker-data
    external: true

# ==========================================
# 网络
# ==========================================
networks:
  agent-qr-network:
    name: agent-qr-network
    driver: bridge
